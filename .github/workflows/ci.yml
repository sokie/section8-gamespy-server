name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Check formatting
        run: ruff format --check .

      - name: Lint with ruff
        run: ruff check .

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Check the example config loads
        run: python -c "from server.config import Config; Config.load('config.example.json')"

      - name: Run tests
        run: |
          coverage run -m tests.smoke
          coverage run -a -m tests.smoke_section8
          coverage run -a -m tests.smoke_portal
          coverage run -a -m tests.smoke_carry
          coverage run -a -m tests.smoke_container
          coverage xml
          coverage report --show-missing

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Starts the server as a user does on each OS, through Python and as the built executable, and checks
  # that it reads the config.json beside it.
  launch:
    name: Launch (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Start through Python
        run: python scripts/check_launch.py

      - name: Build the executable
        run: pyinstaller section8-server.spec

      - name: Start the executable from another directory
        run: python scripts/check_launch.py "dist/section8-server${{ runner.os == 'Windows' && '.exe' || '' }}"

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't fail CI, just report issues
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run mypy
        run: mypy server --ignore-missing-imports || echo "Type check found issues (non-blocking)"
