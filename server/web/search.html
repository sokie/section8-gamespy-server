<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Search · Section 8 Stats</title>
  <link rel="stylesheet" href="/static/portal.css">
  <script type="module" src="/static/js/search.js"></script>
</head>
<body data-page="search">
<!--#include file="header.html" -->
<main>
  <h1>Search</h1>
  <p class="sub" id="search-summary">Loading&hellip;</p>
  <div class="panel scroll" id="results">
    <table>
      <thead>
        <tr><th>Player</th><th>Rank</th><th class="n">Lvl</th><th class="n">XP</th></tr>
      </thead>
      <tbody id="results-rows"></tbody>
    </table>
  </div>
</main>

<template id="tpl-result-row">
  <tr>
    <td>
      <div class="who"><img class="ico-s" data-field="icon" alt="" loading="lazy"><a data-field="name"></a></div>
    </td>
    <td class="rank" data-field="rank"></td>
    <td class="n" data-field="level"></td>
    <td class="n" data-field="xp"></td>
  </tr>
</template>
<!--#include file="footer.html" -->
</body>
</html>
